services:
  - type: web
    name: nur-hatm-backend-bot
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: CHANNEL_ID
        sync: false
      - key: WEBAPP_URL
        value: "https://nur-hatm-bot.vercel.app"
      - key: DATABASE_URL
        sync: false
      - key: DEFAULT_TIMER_HOURS
        value: "24"
      - key: POINTS_ON_COMPLETE
        value: "10"
      - key: POINTS_ON_EXPIRE_PENALTY
        value: "5"
